name: Deploy Umami (prebuilt)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Inject real DATABASE_URL into pulled env
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          sed -i "s|^DATABASE_URL=.*|DATABASE_URL=${DATABASE_URL}|" .vercel/.env.production.local
          if grep -q '\[SENSITIVE\]' .vercel/.env.production.local; then
            echo "Placeholder still present in pulled env - aborting."
            exit 1
          fi
          echo "DATABASE_URL line replaced; placeholder gone."

      - name: Build (prebuilt)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Live check
        run: |
          sleep 10
          curl -s -o /dev/null -w "%{http_code}\n" https://umami-jet-alpha.vercel.app || true
